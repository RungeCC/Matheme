[package]
name = "matheme-world"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
typst = "=0.15.1"
# Must match typst's comemo so `comemo::evict` clears the same global cache.
comemo = "0.5.1"
typst-kit = { version = "=0.15.1", features = [
  "scan-fonts",
  "system-files",
  "emit-diagnostics",
  "embedded-fonts",
] }
# Windows native-tls uses schannel; avoids typst-kit/system-downloader's
# non-Windows openssl dependency, which is unavailable in this registry index.
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
typst-layout = "=0.15.1"
