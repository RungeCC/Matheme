[package]
name = "matheme-world"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
typst.workspace = true
typst-eval.workspace = true
typst-html.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-svg.workspace = true
# Must match typst's comemo so `comemo::evict` clears the same global cache.
comemo.workspace = true
typst-kit.workspace = true
# Windows native-tls uses schannel; avoids typst-kit/system-downloader's
# non-Windows openssl dependency, which is unavailable in this registry index.
ureq.workspace = true
# Used to keep a parsed copy of the Universe index that typst downloads.
serde.workspace = true
serde_json.workspace = true
# Already in the dependency graph via `typst`; reused for calendar conversion.
time.workspace = true
