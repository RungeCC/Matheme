[package]
name = "matheme-graphics"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

[features]
default = ["wl"]
wl = ["dep:matheme-wl"]

[dependencies]
matheme-wl = { path = "../matheme-wl", optional = true }
image = { version = "0.25", default-features = false }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
ttf-parser = "0.25"
kurbo = "0.13"
usvg = "0.47"

[dev-dependencies]
matheme-world = { path = "../matheme-world" }
