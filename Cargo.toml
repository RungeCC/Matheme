[workspace]
members = [
    "crates/matheme",
    "crates/matheme-graphics",
    "crates/matheme-world",
    "crates/matheme-wl",
    "crates/matheme-box",
    "crates/matheme-wstp",
    "crates/matheme-cli",
    "bench",
]
default-members = ["crates/matheme"]
resolver = "3"

# `windows` 0.32's bundled windows.lib binds WaitOnAddress/WakeByAddress*
# to vertdll.dll (VBS enclave stubs), which crash libtest on Windows.
# Fixed upstream in win32metadata (microsoft/windows-rs#2027). The patch
# crate below has no binary: its build.rs copies the official corrected
# windows.lib from windows_x86_64_msvc 0.42.2 into OUT_DIR at build time.
[patch.crates-io]
windows_x86_64_msvc = { path = "vendor/windows_x86_64_msvc" }

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
matheme-box = { path = "crates/matheme-box" }
matheme-graphics = { path = "crates/matheme-graphics" }
matheme-world = { path = "crates/matheme-world" }
matheme-wl = { path = "crates/matheme-wl" }
matheme-wstp = { path = "crates/matheme-wstp" }

# External crates
clap = { version = "4", features = ["derive"] }
comemo = "0.5.1"
criterion = { version = "0.8", features = ["html_reports"] }
image = { version = "0.25", default-features = false }
kurbo = "0.13"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
tinytemplate = "1.2.1"
ttf-parser = "0.25"
typst = "=0.15.1"
typst-eval = "=0.15.1"
typst-html = "=0.15.1"
typst-kit = { version = "=0.15.1", features = [
  "scan-fonts",
  "system-files",
  "emit-diagnostics",
  "embedded-fonts",
] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
usvg = "0.47"
wolfram-app-discovery = "0.6.0"
wolfram-expr = "0.6.0"
wolfram-library-link = "=0.6.1"
wstp = "0.6.0"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
