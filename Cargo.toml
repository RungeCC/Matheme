[workspace]
members = [
    "crates/matheme",
    "crates/matheme-graphics",
    "crates/matheme-world",
    "crates/matheme-wl",
    "crates/matheme-wstp",
    "crates/matheme-cli",
    "bench",
]
default-members = ["crates/matheme"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
