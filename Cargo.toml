[workspace]
members = ["crates/matheme-world", "crates/matheme-wl", "crates/matheme-cli"]
resolver = "2"

[package]
name = "matheme"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "matheme"
crate-type = ["cdylib"]

[dependencies]
matheme-world = { path = "crates/matheme-world" }
matheme-wl = { path = "crates/matheme-wl", features = ["wstp"] }
wolfram-library-link = "=0.6.1"
typst = "=0.15.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
